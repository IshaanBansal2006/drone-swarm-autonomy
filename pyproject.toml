[project]
name = "mini-lattice"
version = "0.0.0"
description = "Multi-agent command-and-control platform (Lattice-inspired). One operator, N sim drones, heterogeneous sensors."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ishaan Bansal" }]
license = { text = "MIT" }

dependencies = [
    # Fill in as decisions get made. Kept intentionally empty so nothing
    # ships that presumes a sim/algorithm choice (see docs/decisions/).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_lattice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
