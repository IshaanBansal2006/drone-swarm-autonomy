name: tests

# The repository is closed to feature work, so this exists to prove one thing:
# that the quickstart in the README still works from a clean checkout. If a
# dependency drifts and `pip install -e .` stops resolving, this catches it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (exactly what the README tells a visitor to run)
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check src tests --select E9,F63,F7,F82
        # Syntax/undefined-name errors only. The full rule set in pyproject
        # reports pre-existing style debt (mathematical single-letter names
        # like S and P are deliberate), so gating on it would fail every run
        # for no signal.
